        <div class="float-left card border-secondary mb-3" style="max-width: 30rem;">
          <div class="card-header" style="font-size:1.25rem">AWS Cost Report</div>
          <div class="card-body">
            <h4 class="card-title"></h4>
              <br><p class="card-text">조회하려는 파일 번호, 시작월, 종료월을 입력하세요.</p><br>
              <form method="post" action="/cost_report">
                {% csrf_token %}
              <table class="table table-hover">
                <tbody>
                <tr class="">
                  <th scope="row" style="padding-top:15px">Account ID</th>
                  <td>
                      <input type="text" placeholder="AWS Account ID  ex)101-103,201-202" class="form-control" id="file_no" name="file_no">
                  </td>
                </tr>
                <tr class="">
                  <th scope="row" style="padding-top:15px">시작월</th>
                  <td><input type="text" placeholder="시작월을 입력하세요" class="form-control" id="start_date" name="start_date"></td>
                </tr>
                <tr class="">
                  <th scope="row" style="padding-top:15px">종료월</th>
                  <td><input type="text" placeholder="종료월을 입력하세요(시작월과 같으면 *)" class="form-control" id="end_date" name="end_date"></td>
                </tr>
                </tbody>
            </table>

            <input class="btn btn-secondary" type="submit" value="리포트보기" style="float: right; font-size:1rem" id="search"></input>
            <input class="btn btn-secondary" type="button" onclick="alert('조회중입니다 잠시만 기다려주세요');location.href='/look_up'" value="API호출" style="float: left; font-size:1rem; margin-right:5px;" id="report"></input>
              </form>
          </div>
        </div>
